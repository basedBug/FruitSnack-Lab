; FruitSnack — ESP32-S3 hotend controller
;
;   Firmware  : ESP32-S3 (Arduino framework, pioarduino / ESP-IDF 5.x base)
;   Services  : AsyncWebServer + WebSockets + ArduinoJSON, LittleFS dashboard
;   Console   : USB CDC (Serial) and hardware UART1 @ 921600 baud
;   Network   : WiFi STA + mDNS (http://<hostname>.local)
;
; Build :  pio run -e esp32s3_custom
; Flash :  pio run -t upload && pio run -t uploadfs
; Logs  :  pio device monitor -b 921600

[platformio]
default_envs = esp32s3_custom
src_dir = src
data_dir = data

[env:esp32s3_custom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = ESP32-S3-DevKitC-1-N8R2
framework = arduino

; --- storage -----------------------------------------------------------------
board_build.filesystem = littlefs
board_build.filesystem_partition = littlefs
board_build.partitions = partitions.csv

; --- upload / monitor --------------------------------------------------------
upload_speed = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; --- libraries --------------------------------------------------------------
; Exact pins = the combination the ESP32Async project itself CI-builds against
; pioarduino / Arduino core 3.x for the ESP32-S3.
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
lib_compat_mode = strict
lib_ldf_mode = chain

; --- build flags -------------------------------------------------------------
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; AsyncTCP tuning (library macros, not Kconfig)
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DDEFAULT_MAX_WS_CLIENTS=8

build_type = release
